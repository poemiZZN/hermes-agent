name: scriptmaker
version: 1.1.0
description: IDEA TO SCRIPT profile for full-cycle script development, adaptation, language polishing, review, task control, and export.
hermes_requires: ">=0.20.0,<0.21.0"
author: storyboard-web
env_requires:
  - name: API_SERVER_KEY
    description: Distinct profile-scoped key (at least 16 characters) used to authenticate /p/scriptmaker API requests.
    required: true
  - name: SCRIPTMAKER_API_BASE
    description: Optional fallback callback URL when a turn does not provide X-Hermes-Platform-Api-Base.
    required: false
distribution_owned:
  - SOUL.md
  - config.yaml
  - .env.template
  - skills/
