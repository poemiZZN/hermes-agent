name: scriptmaker
version: 1.8.0
description: IDEA TO SCRIPT profile for full-cycle script development, adaptation, language polishing, review, task control, and export.
hermes_requires: ">=0.21.0,<0.22.0"
author: storyboard-web
env_requires:
  - name: API_SERVER_KEY
    description: Distinct profile-scoped key (at least 16 characters) used to authenticate /p/scriptmaker API requests.
    required: true
  - name: SCRIPTMAKER_API_BASE
    description: Optional fallback callback URL when a turn does not provide X-Hermes-Platform-Api-Base.
    required: false
  - name: SCRIPTMAKER_MODEL_API_KEY
    description: Shared New API token for model calls that carry no per-user X-Hermes-Platform-Model-Key.
    required: false
  # Required: auxiliary.background_review routes to it, and without it a review
  # would silently fall back to the triggering user's own key.
  - name: SCRIPTMAKER_REVIEW_API_KEY
    description: Platform-owned New API token used only by background skill review.
    required: true
distribution_owned:
  - SOUL.md
  - config.yaml
  - .env.template
  - skills/
