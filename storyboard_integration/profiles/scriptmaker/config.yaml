toolsets:
  - hermes-cli

platform_toolsets:
  api_server:
    - skills
    - memory
    - session_search
    - scriptmaker
    - web

agent:
  disabled_toolsets:
    - storyboard

# 本 profile 的 15 个平台工具（ask_choice、prepare_script_generation 等）默认会被
# tool_search 延迟披露：它们不在模型可见的工具数组里，模型必须先花一轮
# tool_describe 取 schema 才能调用。2026-09-22 实测一次这样的取 schema 往返要多花
# 约 25k 输入 token 和 27 秒，而把全部延迟 schema 常驻只要约 1.7k token —— 净省。
#
# 注意 should_activate() 的语义：只要存在任何可延迟工具就会激活桥接，threshold_pct
# 只控制清单预算、不控制激活。所以"只把某几个工具提升为常驻"在配置层面做不到，
# 只能整体关掉，或改 fork 往 toolsets._HERMES_CORE_TOOLS 里加。
#
# web_search / web_extract 本来就在 _HERMES_CORE_TOOLS 里，任何时候都不会被延迟，
# 不受这一项影响。
tools:
  tool_search:
    enabled: "off"

# scriptmaker 启用了 web toolset，后端必须随之带上：Hermes 的默认值是
# backend: "" + provider_tier: {}，会落回 keyless 环，而环里的 exa 和 firecrawl
# 在本构建上是坏的，全新安装的第一次搜索就会失败。
#
# 多路复用下每个 profile 的 config.yaml 相互独立，根目录 ~/.hermes/config.yaml
# 的 web 段不会被继承 —— 这里必须自带一份。
#
# tavily 在本构建里没有 provider，历史全局配置 backend: tavily 是死配置。
# 2026-09-22 实测：keyless 四家里只有 parallel 和 keenable 可用（exa 返回
# Unrecognized MCP response shape，firecrawl 403）。search_with_failover() 只在
# 限流类错误时才换下一家，所以环的起点必须钉死。端点恢复后可重新评估这几行。
web:
  backend: parallel
  search_backend: parallel
  extract_backend: parallel
  keyless_fallback: true
  provider_tier:
    parallel: free      # 强制 keyless（无 key 也走公共端点），并 pin 为环起点
    keenable: free      # 限流时的故障转移目标
    exa: paid           # 端点已坏，用 paid 把它排除出 keyless 环
    firecrawl: paid     # 同上（403）
